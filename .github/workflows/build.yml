name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: '40 4 * * 4'

jobs:
  build:
    permissions:
      contents: write
    uses: toy/docset-builder/.github/workflows/build.yml@main # zizmor: ignore[unpinned-uses]
    with:
      cache-path: |
        ~/.cache/go-build
        ~/go/pkg/mod
        .cache-mark
        .css
        .pagelist
        data
    secrets:
      DASH_USER_CONTRIBUTIONS_PAT: ${{ secrets.DASH_USER_CONTRIBUTIONS_PAT }}
